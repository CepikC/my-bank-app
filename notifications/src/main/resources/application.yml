server:
  port: 8087

spring:

  application:
    name: notifications

  main:
    web-application-type: reactive

  cloud:

  # Security
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://my-bank-app-keycloak:8180/realms/bankapp/protocol/openid-connect/certs

  # Liquibase
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    drop-first: true

  # Datasource (reactive)
  r2dbc:
    url: r2dbc:postgresql://localhost:5434/notifications-db
    username: postgres
    password: postgres

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:kafka:29092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: kz.yandex.*
        allow.auto.create.topics: true
    listener:
      ack-mode: ${KAFKA_ACK_MODE:record}

kafka-topics:
  notifications-topic: topic-bankapp-notifications

headers:
  user-header: X-User-Login

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

logging:
  level:
    web: info
    org.springframework.security: info

services:
  service-gateway:
    name: "my-bank-app-gateway-api:8080"