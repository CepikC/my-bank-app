server:
  port: 8081

spring:

  application:
    name: convert

  main:
    web-application-type: reactive

  cloud:

    # Gateway (service-locator)
    gateway:
      server:
        webflux:
          routes:
            - id: service-front-route
              uri: http://my-bank-app-gateway-api
              predicates:
                - Path=/
              filters:
                - TokenRelay=bankapp-client

  # Security
  security:
    oauth2:
      client:
        provider:
          keycloak:
            token-uri: http://my-bank-app-keycloak:8180/realms/bankapp/protocol/openid-connect/token
            authorization-uri: http://my-bank-app-keycloak:8180/realms/bankapp/protocol/openid-connect/auth
            jwk-set-uri: http://my-bank-app-keycloak:8180/realms/bankapp/protocol/openid-connect/certs
        registration:
          bankapp-client:
            client-id: bankapp-client
            client-secret: VmGXQDXNGOZzJH5Mx7Fi4OyHtnb3IH8A
            authorization-grant-type: client_credentials
            scope: openid
            provider: keycloak
  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:kafka:29092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: latest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: kz.yandex.*
        allow.auto.create.topics: true
    listener:
      ack-mode: ${KAFKA_ACK_MODE:record}

kafka-topics:
  exchange-rates-topic: topic-bankapp-exchange-rates

# Circuit Breaker
resilience4j:
  retry:
    instances:
      gateway-service:
        max-attempts: 3
        wait-duration: 1s
  circuitbreaker:
    instances:
      gateway-service:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

headers:
  user-header: X-User-Login

management:
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  tracing:
    sampling:
      probability: 1
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

logging:
  level:
    web: info
    org.springframework.security: info


services:
  service-gateway:
    name: "my-bank-app-gateway-api:8080"